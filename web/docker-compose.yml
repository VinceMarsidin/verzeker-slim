services:
  postgres:
    image: postgres:16-alpine
    container_name: verzekerslim-db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: verzekerslim
    volumes:
      - verzekerslim_pgdata:/var/lib/postgresql/data

volumes:
  verzekerslim_pgdata: