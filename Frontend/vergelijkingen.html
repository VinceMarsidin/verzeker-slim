<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vergelijkingen | VerzekerSlim</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/vergelijkingen.css">
</head>

<body>


  <!--TOP HEADER HEADER FOR NAV BAR-->
  <header id="header">
    <img src="/img/logo.png" class="logo" alt="Logo" />
    <!--NAVIGATION BAR-->
    <nav class="nav" id="nav-links">
      <a class="nav-link" href="/index.html">Home</a>
      <a class="nav-link" href="/vergelijkingen.html">Vergelijkingen</a>
      <a class="nav-link" href="/contact.html">Contact</a>
      <a class="nav-link" href="/help.html">Help</a>
    </nav>
    <!-- Hamburger Button -->
    <button id="hamburger" aria-label="Menu">&#9776;</button>
  </header>


  <main>
    <section class="comparison-header">
      <h1>Verzekeringen Vergelijken</h1>

      <div class="category-selector">
        <label for="typeSelect">Kies type verzekering:</label>
        <select id="typeSelect" onchange="veranderCategorie(this.value)">
          <option value="motor">Motorrijtuigverzekering</option>
          <option value="reis">Reisverzekering</option>
          <option value="woon">Woonverzekering</option>
          <option value="leven">Levensverzekering</option>
        </select>
      </div>

      <div class="companies">
        <p>Markeer een maatschappij:</p>
        <button class="company-btn" data-company="assuria" style="background: green;">Assuria</button>
        <button class="company-btn" data-company="fatum" style="background: orange;">Fatum</button>
        <button class="company-btn" data-company="self" style="background: gold; color: black;">Self Reliance</button>
        <button class="company-btn" data-company="par" style="background: red;">Parsasco</button>
      </div>

      <div id="visit-website-container" style="margin-top: 25px; display: none;">
        <a id="external-link" href="#" target="_blank" class="visit-btn"
          style="display: inline-block; padding: 10px 20px; background: #004080; color: white; text-decoration: none; border-radius: 5px;">
          Bezoek de officiële website van <span id="company-name-display"></span> →
        </a>
      </div>
    </section>

    <section class="comparison-table">
      <h2 id="table-title">Vergelijking - Suriname</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Dekking</th>
              <th id="th-assuria">Assuria</th>
              <th id="th-fatum">Fatum</th>
              <th id="th-self">Self Reliance</th>
              <th id="th-par">Parsasco</th>
            </tr>
          </thead>
          <tbody id="table-body">
          </tbody>
        </table>
      </div>
    </section>

    <section class="premium-calculator">
      <div class="calc-card">
        <h2>Snelle WA Premie Indicatie</h2>
        <p>Wat is de huidige dagwaarde van uw voertuig?</p>
        <div class="calc-input-group">
          <span>SRD</span>
          <input type="number" id="carValue" placeholder="Bijv. 150000">
          <button id="calc-btn">Bereken</button>
        </div>
        <div id="calc-result"></div>
      </div>
    </section>

  </main>

  <footer>
    <p>© 2026 VerzekerSlim</p>
  </footer>

  <script src="/js/main.js" type="text/javascript"></script>
  <script src="/js/vergelijking.js" type="text/javascript"></script>
</body>

</html>
