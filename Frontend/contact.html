<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | VerzekerSlim</title>
  <link rel="icon" type="image/svg+xml" href="/img/Favicon.svg">
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/Frontend/css/contact.css">
</head>

<body>
  <!--TOP HEADER HEADER FOR NAV BAR-->
  <header id="header">
    <img src="/img/logo.png" class="logo" alt="Logo" />
    <!--NAVIGATION BAR-->
    <nav class="nav" id="nav-links">
      <a class="nav-link" href="/index.html">Home</a>
      <a class="nav-link" href="/vergelijkingen.html">Vergelijkingen</a>
      <a class="nav-link" href="/contact.html">Contact</a>
      <a class="nav-link" href="/help.html">Help</a>
    </nav>
    <!-- Hamburger Button -->
    <button id="hamburger" aria-label="Menu">&#9776;</button>
  </header>


  <main>
    <!-- PAGE HERO -->
    <section class="contact-hero">
      <h1>Neem contact met ons op</h1>
      <p>Heb je meer vragen over verzekeringen? Wij helpen je graag verder.</p>
    </section>


    <!-- CONTACT SECTION -->
    <section class="contact-container">
      <!-- Contact Form -->
      <div class="contact-form">
        <h2>Stuur ons een bericht</h2>
        <form id="contactForm">
          <input type="text" id="name" placeholder="Volledige naam" required />
          <input type="email" id="email" placeholder="E-mailadres" required />
          <input type="number" id="phone" placeholder="Telefoonnummer" required />
          <select id="subject" required>
            <!-- SELECT ONDERWERP -->
            <option value="">Selecteer onderwerp</option>
            <option value="Motorrijtuig">Motorrijtuigverzekering</option>
            <option value="Reis">Reisverzekering</option>
            <option value="Woon">Woonverzekering</option>
            <option value="Leven">Levensverzekering</option>
            <option value="Overig ">Overige Zaken</option>
          </select>
          <textarea id="message" placeholder="Jouw bericht..." rows="5" required></textarea>
          <button type="submit" id="submitBtn">Verstuur bericht</button>
          <div id="formResponse" style="margin-top: 15px; padding: 10px; border-radius: 5px; display: none;"></div>
        </form>
      </div>

      <!-- Contact Info -->
      <div class="contact-info">
        <h2>Contactinformatie</h2>
        <p><strong>Email:</strong> info@verzekerslim.sr</p>
        <p><strong>Telefoon:</strong> +597 456789 </p>
        <p><strong>WhatsApp:</strong> +597 8765432</p>
        <p><strong>Adres:</strong> Paramaribo, Suriname</p>

        <div class="contact-image-wrapper">
          <img src="/img/contact-illustration.svg" alt="Ondersteuning" class="contact-img" />
        </div>

        <!-- <div class="social-links">
          <a href="https://www.facebook.com/VerzekerSlim" target="_blank"><img src="/img/facebook.png"
              alt="Facebook"></a>
          <a href="https://www.instagram.com/VerzekerSlim" target="_blank"><img src="/img/instagram.png"
              alt="Instagram"></a>
          <a href="https://www.twitter.com/VerzekerSlim" target="_blank"><img src="/img/twitter.png" alt="Twitter"></a>
        </div> -->
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 VerzekerSlim</p>
  </footer>

  <script src="/js/main.js" type="text/javascript"></script>
  <script src="/js/contact.js"></script>
</body>

</html>
