<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home | VerzekerSlim</title>
  <link rel="stylesheet" href="/Verzerkerslim/css/main.css" />
  <link rel="stylesheet" href="/Verzerkerslim/css/contact.css">
</head>

<body>
  <!--TOP HEADER HEADER FOR NAV BAR-->
  <header id="header">
    <img src="/Verzerkerslim/img/Logo.png" class="logo" alt="Logo" />
    <!--NAVIGATION BAR-->
    <nav class="nav" id="nav-links">
      <a class="nav-link" href="/Verzerkerslim/index.html">Home</a>
      <a class="nav-link" href="/Verzerkerslim/vergelijkingen.html">Vergelijkingen</a>
      <a class="nav-link" href="/Verzerkerslim/contact.html">Contact</a>
      <a class="nav-link" href="/Verzerkerslim/help.html">Help</a>
    </nav>
      <!-- Hamburger Button -->
      <button id="hamburger" aria-label="Menu">&#9776;</button>
  </header>

  <main>
    <!-- HERO -->
    <section class="contact-hero">
      <h1>Neem contact met ons op</h1>
      <p>Heb je meer vragen over verzekeringen? Wij helpen je graag verder.</p>
    </section>
    <!-- CONTACT SECTION -->
    <section class="contact-container">
      <!-- Contact Form -->
      <div class="contact-form">
        <h2>Stuur ons een bericht</h2>
        <form>
          <input type="text" placeholder="Volledige naam" required />
          <input type="email" placeholder="E-mailadres" required />
          <input type="number" placeholder="Telefoonnummer" required />
          <select required>
            <!-- SELECT ONDERWERP -->
            <option value="">Selecteer onderwerp</option>
            <option>Motorrijtuigverzekering</option>
            <option>Reisverzekering</option>
            <option>Woonverzekering</option>
            <option>Levensverzekering</option>
          </select>
          <textarea placeholder="Jouw bericht..." rows="5" required></textarea>
          <button type="submit">Verstuur bericht</button>
        </form>
      </div>
      <!-- Contact Info -->
      <div class="contact-info">
        <h2>Contactinformatie</h2>
        <p><strong>Email:</strong> info@verzekerslim.sr</p>
        <p><strong>Telefoon:</strong> +597 123 4567</p>
        <p><strong>Adres:</strong> Paramaribo, Suriname</p>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 VerzekerSlim</p>
  </footer>

  <script src="/Verzerkerslim/js/main.js" type="text/javascript"></script>
</body>

</html>
